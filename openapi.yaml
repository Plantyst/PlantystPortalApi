          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /Metadocuments/{guid}/ProductionEntries:
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the metadocument.
    post:
      operationId: addProductionEntry
      tags: [Metadocuments]
      summary: Add Production Entry
      description: |
        Adds a production entry (produced amount record) into the metadocument.

        Required access right: _Contributor_.

        The command result does not carry the identifier of the new entry - read the metadocument and find the entry by its `time`, `value` and `type`. The highest `id` is the new entry only when nothing else changed the metadocument in the meantime (see the `ProductionEntry` schema).

        When the production entries of the metadocument are managed by a linked external source, the server responds with `405 Method Not Allowed`.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionEntryCreate"
            example:
              Value: 120
              Type: OK
              Time: "2026-07-01T07:00:00Z"
      responses:
        "202":
          $ref: "#/components/responses/MetadocumentCommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: The production entries of the metadocument are managed by a linked external source and cannot be modified directly.
    patch:
      operationId: patchProductionEntry
      tags: [Metadocuments]
      summary: Patch Production Entry
      description: |
        Updates the production entry with the specific `Id` of the given metadocument. The entry is replaced as a whole - provide all its properties, including `Time` (when `Time` is omitted, the current UTC time is used, which fails with the `DataError` result for metadocuments in the past - asynchronously, the request itself is still answered with `202 Accepted`). The time range check is inclusive on both ends, as for the create operation.

        Required access right: _Contributor_.

        The replacement covers every property - an omitted `Note` or `Reason` clears the stored value, and an omitted `Time` moves the entry to the current time. Send the unchanged properties along with the changed one.

        __Note:__ Updating a production entry assigns it a new `id` (the `id` identifies the entry and its version), and every further update assigns the next one. Re-read the metadocument to get the current `id` before a subsequent update or delete - repeating this request with the previous `id` ends with `404 Not Found`, synchronously and without creating a command, so such a repeat never applies twice.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [Id]
                  properties:
                    Id:
                      type: integer
                      description: The identifier of the production entry within the metadocument.
                - $ref: "#/components/schemas/ProductionEntryCreate"
            example:
              Id: 1
              Value: 150
              Type: OK
      responses:
        "202":
          $ref: "#/components/responses/MetadocumentCommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: The production entries of the metadocument are managed by a linked external source and cannot be modified directly.

  /Metadocuments/{guid}/ProductionEntries/{id}:
    delete:
      operationId: deleteProductionEntry
      tags: [Metadocuments]
      summary: Delete Production Entry
      description: |
        Deletes the production entry of the specific metadocument. When the metadocument has no other content, it is deleted as well.

        Required access right: _Contributor_.
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the metadocument.
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The identifier of the production entry within the metadocument.
        - $ref: "#/components/parameters/CommandCustomId"
      responses:
        "202":
          $ref: "#/components/responses/MetadocumentCommandAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: The production entries of the metadocument are managed by a linked external source and cannot be modified directly.

  /MetadocumentsQuery:
    post:
      operationId: queryMetadocuments
      tags: [Metadocuments]
      summary: Get Metadocuments
      description: |
        Gets the metadocuments for the given measurements and time ranges. The request may contain at most 100 queries.

        Each returned metadocument carries its own `_embedded.comment` and `_embedded.productionEntry` (see the `Metadocument` schema); the related users are returned once, in the top-level `_embedded.user`.

        A metadocument is returned when its time range overlaps the queried range, both ends inclusive; a metadocument without `to` counts as still running. It is returned whole - with all its comments and production entries, including those outside the queried range. The sum of the `_embedded.productionEntry` values is therefore the production recorded on the whole metadocument, not the production of the queried range; for the production of a range use `/MeasurementMetricsQuery2`.

        Required access right: _View_ for every queried measurement (otherwise `403 Forbidden`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Queries:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [MeasurementId, From, To]
                    properties:
                      MeasurementId:
                        type: integer
                      From:
                        type: string
                        format: date-time
                      To:
                        type: string
                        format: date-time
            example:
              Queries:
                - MeasurementId: 3
                  From: "2026-06-30T22:00:00Z"
                  To: "2026-07-01T19:59:59Z"
      responses:
        "200":
          description: The metadocuments with related users.
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  responseContinuation:
                    type: string
                    description: Continuation token if the returned data are too long for one response; empty if the query is fully satisfied.
                  dateTime:
                    type: string
                    format: date-time
                    description: UTC date and time for which the response is up to date.
                  _links:
                    $ref: "#/components/schemas/HalLinks"
                  _embedded:
                    type: object
                    properties:
                      user:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserSummary"
                      metadocument:
                        type: array
                        items:
                          $ref: "#/components/schemas/Metadocument"
              example:
                responseContinuation: ""
                dateTime: "2026-07-11T07:03:03.211009Z"
                _links:
                  self:
                    href: /Api/MetadocumentsQuery/
                _embedded:
                  user:
                    - userId: 497
                      name: Jan Novák
                      _links:
                        self:
                          href: /Api/Users/497
                  metadocument:
                    - guid: 13f6a3b3-0416-49e9-81ed-fab139518c0d
                      type: 1
                      creatorId: 497
                      measurementId: 3
                      from: "2026-07-01T10:18:00Z"
                      to: "2026-07-01T10:18:00Z"
                      eTag: "\"2f007274-0000-0d00-0000-6a4e18d80000\""
                      lastModified: "2026-07-04T07:48:34Z"
                      _links:
                        self:
                          href: /Api/Metadocuments/13f6a3b3-0416-49e9-81ed-fab139518c0d
                      _embedded:
                        comment:
                          - id: 0
                            text: Ahoj...
                            modificationTime: "2026-07-03T12:00:56Z"
                            _links:
                              self:
                                href: /Api/Metadocuments/13f6a3b3-0416-49e9-81ed-fab139518c0d/Comments/0/
                              user:
                                href: /Api/Users/497
                    - guid: 8c1f4e2a-6d3b-4b9e-9a71-2f0c5d7e6b44
                      type: 2
                      title: Work order 42
                      creatorId: 497
                      measurementId: 3
                      from: "2026-07-01T05:30:00Z"
                      to: "2026-07-01T07:30:00Z"
                      setpoint: 30
                      eTag: "\"2f007274-0000-0d00-0000-6a4e18d90000\""
                      lastModified: "2026-07-01T07:05:12Z"
                      _links:
                        self:
                          href: /Api/Metadocuments/8c1f4e2a-6d3b-4b9e-9a71-2f0c5d7e6b44
                        user:
                          href: /Api/Users/497
