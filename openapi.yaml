        Required access right: _View_ (of the measurement of the task).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The task.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/TaskEntry"
              example:
                id: 332011b2-f82f-4b05-afb5-a55cc6e71418
                title: Check the tooling
                metadocumentGuid: 112e6ba3-5857-4fde-b22a-b6a0c2c9de54
                commandGuid: f2af1aaf-2b2b-432e-99a5-fd8be1fb1389
                createdDate: "2026-07-12T10:54:03Z"
                dueDate: "2026-07-13T06:00:00Z"
                deadline: "2026-07-14T06:00:00Z"
                _links:
                  self:
                    href: /Api/TaskEntries/332011b2-f82f-4b05-afb5-a55cc6e71418
                  metadocument:
                    href: /Api/Metadocuments/112e6ba3-5857-4fde-b22a-b6a0c2c9de54
                _embedded:
                  user:
                    - userId: 92
                      name: Jan Novák
                      _links:
                        self:
                          href: /Api/Users/92
                  metadocument:
                    guid: 112e6ba3-5857-4fde-b22a-b6a0c2c9de54
                    type: 2
                    title: Work order 42
                    measurementId: 3
                    from: "2026-07-12T08:00:00Z"
                    to: "2026-07-12T09:00:00Z"
                    task:
                      id: 332011b2-f82f-4b05-afb5-a55cc6e71418
                      initialTitle: Check the tooling
                    _links:
                      self:
                        href: /Api/Metadocuments/112e6ba3-5857-4fde-b22a-b6a0c2c9de54
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The task does not exist.

  /TaskEntryAddCommands:
    post:
      operationId: addTaskEntry
      tags: [Tasks (Beta)]
      summary: Create task (Beta)
      description: |
        Creates a task attached to the given metadocument. The operation is an asynchronous command (`202 Accepted` + `location` of the command result).

        Required access right: _Contributor_ (of the measurement of the metadocument); the measurement must belong to the current customer account of the user, otherwise `400 Bad Request`.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Title, MetadocumentGuid]
              properties:
                Title:
                  type: string
                  description: The description of the task; must not be empty.
                MetadocumentGuid:
                  type: string
                  format: uuid
                DueDate:
                  type: [string, "null"]
                  format: date-time
                  description: The planned date of the task.
                Deadline:
                  type: [string, "null"]
                  format: date-time
                  description: The latest date the task should be finished.
            example:
              Title: Check the tooling
              MetadocumentGuid: 112e6ba3-5857-4fde-b22a-b6a0c2c9de54
              DueDate: "2026-07-13T06:00:00Z"
              Deadline: "2026-07-14T06:00:00Z"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The `Title` or `MetadocumentGuid` is missing, or the measurement does not belong to the current customer account of the user.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The metadocument does not exist or the user does not have the Contributor right.

  /TaskEntryUpdateCommands:
    post:
      operationId: updateTaskEntry
      tags: [Tasks (Beta)]
      summary: Update task (Beta)
      description: |
        Updates the task. Only the properties present in the payload are changed (merge semantics):

        * `State: Completed` completes the task (sets its `completedDate` and the completing user; an already completed task keeps the original values), `State: Open` re-opens it
        * `Title` can be changed but not emptied (`400 Bad Request`)
        * `DueDate` and `Deadline` can be set or cleared with `null`

        `OriginGuid` must be the current `commandGuid` of the task - every change assigns a new value, so re-read the task before a subsequent change.

        Required access right: _Contributor_; the measurement must belong to the current customer account of the user.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Id, OriginGuid]
              properties:
                Id:
                  type: string
                OriginGuid:
                  type: string
                  format: uuid
                  description: The current `commandGuid` of the task.
                Title:
                  type: string
                State:
                  type: string
                  enum: [Completed, Open]
                DueDate:
                  type: [string, "null"]
                  format: date-time
                Deadline:
                  type: [string, "null"]
                  format: date-time
            example:
              Id: 332011b2-f82f-4b05-afb5-a55cc6e71418
              OriginGuid: f2af1aaf-2b2b-432e-99a5-fd8be1fb1389
              State: Completed
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The `Id` or `OriginGuid` is missing, the `State` is invalid, the `Title` would become empty, or the measurement does not belong to the current customer account.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The task does not exist (or is deleted), or the user does not have the Contributor right.

  /TaskEntryDeleteCommands:
    post:
      operationId: deleteTaskEntry
      tags: [Tasks (Beta)]
      summary: Delete task (Beta)
      description: |
        Deletes the task (a soft delete - the task disappears from the lists).

        __Known issue:__ the delete command currently fails with `500 Internal Server Error`; until it is fixed, close tasks by completing them (`/TaskEntryUpdateCommands` with `State: Completed`).

        Required access right: _Contributor_; the measurement must belong to the current customer account of the user.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Id, OriginGuid]
              properties:
                Id:
                  type: string
                OriginGuid:
                  type: string
                  format: uuid
                  description: The current `commandGuid` of the task.
            example:
              Id: 332011b2-f82f-4b05-afb5-a55cc6e71418
              OriginGuid: f2af1aaf-2b2b-432e-99a5-fd8be1fb1389
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The `Id` or `OriginGuid` is missing, or the measurement does not belong to the current customer account.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The task does not exist (or is already deleted), or the user does not have the Contributor right.

  # ---------------------------------------------------------------------------
  # Downtime Codes
  # ---------------------------------------------------------------------------
  /DowntimeDictionary:
    get:
      operationId: getDowntimeDictionary
      tags: [Downtime Codes Dictionary]
      summary: Get downtime code dictionary
      description: |
        Gets the downtime code dictionary for the given set of measurements. The response embeds two collections:

        * `downtimeCode` - the downtime codes themselves
        * `measurementDowntimeCode` - the mapping of measurements to their downtime codes (as links)

        Deleted codes are included with a non-null `validTo`; treat them as historical (they may still be referenced by past downtimes).

        Required access right: _View_ (for all queried measurements, otherwise `403 Forbidden`).
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
          description: The measurement identifiers (repeat the parameter for multiple measurements, e.g. `?ids=3&ids=4`).
        - name: culture
          in: query
          required: true
          schema:
            type: string
          example: en-US
          description: The culture identifier (e.g. `en-US`). Reserved for future localization of the dictionary; currently it does not affect the response content. Always provide it - requests without `culture` are served by a legacy variant of the endpoint with a different, obsolete response shape.
      responses:
        "200":
          description: The downtime code dictionary.
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  _links:
                    $ref: "#/components/schemas/HalLinks"
                  _embedded:
                    type: object
                    properties:
                      downtimeCode:
                        type: array
                        items:
                          $ref: "#/components/schemas/DowntimeCode"
                      measurementDowntimeCode:
                        type: array
                        items:
                          type: object
                          properties:
                            measurementId:
                              type: integer
                            _links:
                              $ref: "#/components/schemas/HalLinks"
              example:
                _links:
                  self:
                    href: /Api/DowntimeDictionary
                _embedded:
                  downtimeCode:
                    - downtimeCodeId: 9561
                      key: "144"
                      code: "1.2"
                      title: Tool change
                      color: "#E67E22"
                      commandGuid: bbf8dc05-0735-43b3-a2fb-6406bda5097f
                      canBeSelected: true
                      isCommentRequired: true
                      maxLength: 3600
                      _links:
                        self:
                          href: /Api/DowntimeCode/9561
                    - downtimeCodeId: 9562
                      key: "145"
                      code: "2"
                      title: Breakdown
                      isBreakdown: true
                      validTo: "2025-06-05T08:27:27.547Z"
                      commandGuid: c1f8dc05-0735-43b3-a2fb-6406bda5097f
                      canBeSelected: false
                      _links:
                        self:
                          href: /Api/DowntimeCode/9562
                  measurementDowntimeCode:
                    - measurementId: 3
                      _links:
                        self:
                          href: /Api/Measurement/3/DowntimeCodes
                        downtimeCode:
                          - href: /Api/DowntimeCode/9561
                          - href: /Api/DowntimeCode/9562
        "400":
          description: The `ids` parameter is missing.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /DowntimeCodeAddCommands:
    post:
      operationId: addDowntimeCode
      tags: [Downtime Codes Dictionary]
      summary: Add downtime code
      description: |
        Creates a new downtime code on the given measurements.

        Required access right: _Admin_ (for all listed measurements).
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [MeasurementIds]
                  properties:
                    MeasurementIds:
                      type: array
                      items:
                        type: integer
                      description: The measurements on which the code is created.
                - $ref: "#/components/schemas/DowntimeCodeWrite"
            example:
              MeasurementIds: [3, 4]
              Code: "1.2"
              Title: Tool change
              Color: "#E67E22"
              CanBeSelected: true
              IsCommentRequired: true
              MaxLength: 3600
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid (`Code` and `Title` are required; `Code` must match `^([a-zA-Z0-9]+\.?)+$` and be at most 10 characters long).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /DowntimeCodeUpdateCommands:
    post:
      operationId: updateDowntimeCode
      tags: [Downtime Codes Dictionary]
      summary: Update downtime code
      description: |
        Updates the downtime code identified by `OriginGuids` and `DowntimeCodeIds`. Only the provided properties are changed - omitted optional properties keep their current values (`Code` and `Title` are required even when unchanged).

        Required access right: _Admin_.

        __Note:__ Every change of a code assigns it a new `commandGuid`. Re-read the dictionary to get the current `commandGuid` (used as `OriginGuids`) before a subsequent update, delete or restore; a command with a stale `OriginGuids` value finishes with the `Conflict` result.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [OriginGuids, DowntimeCodeIds]
                  properties:
                    OriginGuids:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: The current `commandGuid` values of the codes to update (see the dictionary).
                    DowntimeCodeIds:
                      type: array
                      items:
                        type: integer
                      description: The `downtimeCodeId` values of the codes to update.
                - $ref: "#/components/schemas/DowntimeCodeWrite"
            example:
              OriginGuids: [bbf8dc05-0735-43b3-a2fb-6406bda5097f]
              DowntimeCodeIds: [9561]
              Code: "1.2"
              Title: Tool change (updated)
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid (`Code` and `Title` are required even when unchanged).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /DowntimeCodeDeleteCommands:
    post:
      operationId: deleteDowntimeCode
      tags: [Downtime Codes Dictionary]
      summary: Delete downtime code
      description: |
        Deletes (deactivates) the downtime codes identified by `OriginGuids` and `DowntimeCodeIds`. The delete is a soft delete - the code gets a `validTo` timestamp and stays in the dictionary for historical downtimes. It can be restored later.

        Required access right: _Admin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [OriginGuids, DowntimeCodeIds]
              properties:
                OriginGuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: The current `commandGuid` values of the codes to delete.
                DowntimeCodeIds:
                  type: array
                  items:
                    type: integer
            example:
              OriginGuids: [bbf8dc05-0735-43b3-a2fb-6406bda5097f]
              DowntimeCodeIds: [9561]
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /DowntimeCodeRestoreCommands:
    post:
      operationId: restoreDowntimeCode
      tags: [Downtime Codes Dictionary]
      summary: Restore downtime code
      description: |
        Restores previously deleted downtime codes (clears their `validTo`).

        Required access right: _Admin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MeasurementIds, OriginGuids, DowntimeCodeIds]
              properties:
                MeasurementIds:
                  type: array
                  items:
                    type: integer
                OriginGuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: The current `commandGuid` values of the codes to restore.
                DowntimeCodeIds:
                  type: array
                  items:
                    type: integer
            example:
              MeasurementIds: [3]
              OriginGuids: [bbf8dc05-0735-43b3-a2fb-6406bda5097f]
              DowntimeCodeIds: [9561]
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /DowntimeCodeCopyCommands:
    post:
      operationId: copyDowntimeCodes
      tags: [Downtime Codes Dictionary]
      summary: Copy downtime codes between measurements
      description: |
        Copies downtime codes from the origin measurement to the target measurements. The `CopyAction` determines the behavior:

        * `CopyAll` - copies all selected codes of the origin measurement
        * `Merge` - adds only the codes missing on the target measurements (matched by `code`)
        * `Overwrite` - copies the codes and overwrites the conflicting ones on the target measurements

        Required access right: _Admin_ (for the target measurements).
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MeasurementIds, OriginMeasurementId, CopyAction, OriginMeasurementGuids]
              properties:
                MeasurementIds:
                  type: array
                  items:
                    type: integer
                  description: The target measurements.
                OriginMeasurementId:
                  type: integer
                  description: The measurement to copy the codes from.
                CopyAction:
                  type: string
                  enum: [CopyAll, Merge, Overwrite]
                OriginMeasurementGuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: The `commandGuid` values of the origin measurement codes to copy.
            example:
              MeasurementIds: [4, 5]
              OriginMeasurementId: 3
              CopyAction: Merge
              OriginMeasurementGuids: [bbf8dc05-0735-43b3-a2fb-6406bda5097f]
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # Automatic Downtime Generation (historical name: downtime alarms)
  # ---------------------------------------------------------------------------
  /DowntimeAlarmAddCommands:
    post:
      operationId: addDowntimeAlarm
      tags: [Automatic Downtime Generation]
      summary: Enable automatic downtime generation
      description: |
        Enables the automatic downtime generation on the given measurements - creates a generation rule with the specified minimum stop length.

        Required access right: _Admin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MeasurementIds, TimeSpan]
              properties:
                MeasurementIds:
                  type: array
                  items:
                    type: integer
                TimeSpan:
                  type: string
                  description: The minimum stop length that triggers the automatic downtime creation, in the `hh:mm:ss` format.
            example:
              MeasurementIds: [3]
              TimeSpan: "00:05:00"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /DowntimeAlarmUpdateCommands:
    post:
      operationId: updateDowntimeAlarm
      tags: [Automatic Downtime Generation]
      summary: Update automatic downtime generation rule
      description: |
        Updates the minimum stop length of the generation rules identified by `OriginGuids` and `ProductionAlarmTriggerIds`.

        Required access right: _Admin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [OriginGuids, ProductionAlarmTriggerIds]
              properties:
                OriginGuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: The `commandGuid` values of the generation rules (assigned by the command that created or last changed them).
                ProductionAlarmTriggerIds:
                  type: array
                  items:
                    type: integer
                  description: The identifiers of the generation rules (historically "production alarm triggers").
                TimeSpan:
                  type: string
                  description: The new minimum stop length, in the `hh:mm:ss` format.
            example:
              OriginGuids: [bbf8dc05-0735-43b3-a2fb-6406bda5097f]
              ProductionAlarmTriggerIds: [42]
              TimeSpan: "00:10:00"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /DowntimeAlarmDeleteCommands:
    post:
      operationId: deleteDowntimeAlarm
      tags: [Automatic Downtime Generation]
      summary: Disable automatic downtime generation
      description: |
        Disables the automatic downtime generation - deletes the generation rules identified by `OriginGuids` and `ProductionAlarmTriggerIds`.

        Required access right: _Admin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [OriginGuids, ProductionAlarmTriggerIds]
              properties:
                OriginGuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                ProductionAlarmTriggerIds:
                  type: array
                  items:
                    type: integer
            example:
              OriginGuids: [bbf8dc05-0735-43b3-a2fb-6406bda5097f]
              ProductionAlarmTriggerIds: [42]
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  # ---------------------------------------------------------------------------
  # Job Plan (endpoints historically named JobTypes)
  # ---------------------------------------------------------------------------
  /JobTypes:
    get:
      operationId: getJobTypes
      tags: [Job Plan]
      summary: List planned jobs
      description: |
        Gets the job plan (the list of planned jobs) of the user's current subscription.

        Required access right: _View_.
      parameters:
        - name: measurementId
          in: query
          required: false
          schema:
            type: integer
          description: When specified, only the planned jobs of the given measurement are returned.
      responses:
        "200":
          description: The job plan (the list of planned jobs).
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  _links:
                    $ref: "#/components/schemas/HalLinks"
                  _embedded:
                    type: object
                    properties:
                      jobType:
                        type: array
                        items:
                          $ref: "#/components/schemas/JobType"
              example:
                _links:
                  self:
                    href: /Api/JobTypes
                _embedded:
                  jobType:
                    - jobTypeId: 730039621
                      title: Order 2026-0042
                      setpoint: 50
                      measurementId: 1770
                      plannedFrom: "2026-07-02T06:50:00Z"
                      plannedTo: "2026-07-02T07:20:00Z"
                      isPermanent: false
                      currentState: Available
                      order: 1
                      commandGuid: 5ad8938c-21dc-4b51-9b2c-3a8bfb2b816d
                      targetAmount: 100
                      workOrderNumber: WO-2026-0042
                      customFields:
                        PartNumber: PN-123
                      _links:
                        self:
                          href: /Api/JobTypes/730039621
                    - jobTypeId: 730039622
                      title: 01.SP
                      setpoint: 36.67
                      measurementId: 1771
                      isPermanent: false
                      currentState: Available
                      order: 1
                      commandGuid: 1d8a6a09-d957-4969-9c69-2a061d6c92f4
                      _links:
                        self:
                          href: /Api/JobTypes/730039622
        "401":
          $ref: "#/components/responses/Unauthorized"

  /JobTypes/{id}:
    get:
      operationId: getJobType
      tags: [Job Plan]
      summary: Get planned job
      description: |
        Gets the planned job with the specific identifier.

        Required access right: _View_.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The planned job identifier.
      responses:
        "200":
          description: The planned job.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/JobType"
              example:
                jobTypeId: 730039621
                title: Order 2026-0042
                setpoint: 50
                measurementId: 1770
                plannedFrom: "2026-07-02T06:50:00Z"
                plannedTo: "2026-07-02T07:20:00Z"
                isPermanent: false
                currentState: Available
                order: 1
                commandGuid: 5ad8938c-21dc-4b51-9b2c-3a8bfb2b816d
                targetAmount: 100
                workOrderNumber: WO-2026-0042
                _links:
                  self:
                    href: /Api/JobTypes/730039621
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /JobTypesImportCommands:
    post:
      operationId: importJobTypes
      tags: [Job Plan]
      summary: Upload the job plan (CSV)
      description: |
        Uploads the CSV file with the job plan (see the group description for the file format). Exactly one file is expected as a multipart content.

        __The import replaces the whole job plan__ of every measurement affected by the file.

        Required access right: _DataAdmin_ (for all affected measurements; insufficient rights on any of them cause the `DataError` command result).

        The import is asynchronous: the response contains the relative URL (`location`) of the command result. Poll the URL until the `result` reaches `Success` or `DataError` (the `reason` property then describes the problem, e.g. `Header does not contain any valid field.` or `Title must be defined.`).

        __Configuration:__ the CSV parsing (the time zone the dates are interpreted in and the culture used for parsing dates and numbers) can be customized per customer account on request - contact the Plantyst support.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [jobTypesFile]
              properties:
                jobTypesFile:
                  type: string
                  contentMediaType: text/csv
                  description: The CSV file with the job plan (UTF-8, comma or semicolon separated, with a header row). Send exactly one file part; the form field name is not significant.
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The multipart data are invalid or more than one file was uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
              example:
                Message: Only single file upload is supported.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The user does not have the DataAdmin right for any measurement.
        "415":
          description: The request content is not a MIME multipart content.

  # ---------------------------------------------------------------------------
  # Calendar
  # ---------------------------------------------------------------------------
  /Calendars/{measurementId}/Events:
    parameters:
      - name: measurementId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getCalendarEvents
      tags: [Calendar]
      summary: Get calendar events
      description: |
        Gets the calendar events (shifts and planned shutdowns) of the measurement in the given time range.

        Required access right: _View_.
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The calendar events with the related operators.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/CalendarEventList"
              example:
                hasDataAdminAccessRightDictionary:
                  "3": true
                _links:
                  self:
                    href: /Api/Calendars/3/Events/
                _embedded:
                  event:
                    - shiftName: Morning shift
                      shiftType: Morning
                      eventType: PlannedProduction
                      measurementId: 3
                      start: "2026-07-12T06:00:00Z"
                      end: "2026-07-12T14:00:00Z"
                      pauses:
                        - from: "04:00:00"
                          to: "04:15:00"
                      plannedOperatorAssignment: 1
                      overtime: false
                      guid: 29488260-a3c8-4ed4-be08-2fd84fbfd66c
                      _links:
                        self:
                          href: /Api/Calendars/3/Events/PlannedProduction/1783836000
                        operators:
                          href: /Api/Users/101
                  user:
                    - userId: 101
                      name: Jan Novák
                      _links:
                        self:
                          href: /Api/Users/101
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCalendarEvent
      tags: [Calendar]
      summary: Create calendar event
      description: |
        Creates a calendar event (a shift or a planned shutdown) on the measurement.

        Required access right: _DataAdmin_.

        __The events of a measurement must not overlap__, and the rule spans both types - shifts and planned shutdowns share one timeline. A create colliding with an existing event is accepted with `202` and then finishes with the `DataError` command result - nothing is written. Ranges are half-open `[FromDate, ToDate)`, so an event starting exactly when another ends is accepted. The create is not an upsert: a request repeating the `FromDate` of an existing event of the same type is refused instead of updating it, even when the rest of the payload differs (use `PATCH` to change an event).

        Because of this, __the create can be safely retried__: when the client does not know whether an earlier attempt got through, repeating the same request either creates the event or fails with `DataError`, so a duplicate cannot arise.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [FromDate, ToDate]
              properties:
                FromDate:
                  type: string
                  format: date-time
                  description: The start of the event; it also becomes the event identifier (its Unix timestamp).
                ToDate:
                  type: string
                  format: date-time
                EventType:
                  type: string
                  enum: [plannedProduction, plannedShutdown]
                  description: The type of the event; `plannedProduction` (a shift) when omitted.
                ShiftName:
                  type: string
                ShiftType:
                  type: string
                  description: User-defined shift type label (e.g. `Morning`).
                Pauses:
                  type: array
                  items:
                    $ref: "#/components/schemas/PauseIntervalWrite"
                PlannedOperatorAssignment:
                  type: number
                  minimum: 0
                  description: The planned number of assigned operators.
                EffectiveOperatorAssignment:
                  type: number
                  minimum: 0
                  description: The effective number of assigned operators.
                Overtime:
                  type: boolean
            example:
              FromDate: "2026-07-12T06:00:00Z"
              ToDate: "2026-07-12T14:00:00Z"
              EventType: plannedProduction
              ShiftName: Morning shift
              ShiftType: Morning
              Pauses:
                - From: "04:00:00"
                  To: "04:15:00"
              PlannedOperatorAssignment: 1
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid (e.g. a negative operator assignment).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /Calendars/Events:
    post:
      operationId: getCalendarEventsBatch
      tags: [Calendar]
      summary: Get calendar events for multiple measurements
      description: |
        Gets the calendar events for the given measurements and time ranges in one request.

        Required access right: _View_ for every queried measurement (otherwise `403 Forbidden`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Queries:
                  type: array
                  items:
                    type: object
                    required: [MeasurementId, From, To]
                    properties:
                      MeasurementId:
                        type: integer
                      From:
                        type: string
                        format: date-time
                      To:
                        type: string
                        format: date-time
            example:
              Queries:
                - MeasurementId: 3
                  From: "2026-07-12T00:00:00Z"
                  To: "2026-07-19T00:00:00Z"
      responses:
        "200":
          description: The calendar events with the related operators.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/CalendarEventList"
        "400":
          description: The payload is missing or invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /Calendars/{measurementId}/Events/{eventType}/{id}:
    parameters:
      - name: measurementId
        in: path
        required: true
        schema:
          type: integer
      - name: eventType
        in: path
        required: true
        schema:
          type: string
          enum: [plannedProduction, plannedShutdown]
        description: |
          The type of the event - `plannedProduction` or `plannedShutdown`. The value is matched case-insensitively, so the PascalCase form returned by the reads (`"eventType": "PlannedProduction"`) works as well.

          A numeric value outside the enum is answered with `400 Bad Request`; on `PATCH`, `plannedShutdown` is answered with `400` too, because only shifts can be updated.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The event identifier - the Unix timestamp (in seconds) of the event start. Note that changing the event start also changes its identifier.
        example: "1783836000"
    patch:
      operationId: updateCalendarEvent
      tags: [Calendar]
      summary: Update calendar event
      description: |
        Updates the calendar event. Only events of the `plannedProduction` type can be updated (`400 Bad Request` otherwise); a planned shutdown has to be deleted and recreated instead. Only the properties present in the payload are changed (`FromDate`, `ToDate` and `OriginGuid` are always required).

        Unlike other command endpoints, the concurrency check runs synchronously: a stale `OriginGuid` responds with `409 Conflict` immediately.

        Required access right: _DataAdmin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [OriginGuid, FromDate, ToDate]
              properties:
                OriginGuid:
                  type: string
                  format: uuid
                  description: The current `guid` of the event (see the group description).
                FromDate:
                  type: string
                  format: date-time
                  description: The new start of the event. Changing it also changes the event identifier.
                ToDate:
                  type: string
                  format: date-time
                ShiftName:
                  type: string
                ShiftType:
                  type: string
                Pauses:
                  type: array
                  items:
                    $ref: "#/components/schemas/PauseIntervalWrite"
                PlannedOperatorAssignment:
                  type: number
                  minimum: 0
                EffectiveOperatorAssignment:
                  type: number
                  minimum: 0
                Overtime:
                  type: boolean
            example:
              OriginGuid: 29488260-a3c8-4ed4-be08-2fd84fbfd66c
              FromDate: "2026-07-12T06:00:00Z"
              ToDate: "2026-07-12T15:00:00Z"
              ShiftName: Morning shift (extended)
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The event type is not `plannedProduction`, the dates are invalid, or `FromDate` is not before `ToDate`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No event of the given type starts at the time given by `id`.
        "409":
          description: The `OriginGuid` is stale - the event has been modified in the meantime. Re-read the events to get the current `guid`.
    delete:
      operationId: deleteCalendarEvent
      tags: [Calendar]
      summary: Delete calendar event
      description: |
        Deletes the calendar event.

        Required access right: _DataAdmin_.

        __A missing `originGuid` is not reported as `400`.__ A request without it is answered with `405 Method Not Allowed` and the message `The requested resource does not support http method 'DELETE'.`, which is misleading - the method and the path are fine, the query string is not. Check `originGuid` first when a `DELETE` on a calendar event answers `405`.
      parameters:
        - name: originGuid
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The current `guid` of the event. Required - when omitted, the request fails with `405`, not `400`.
        - $ref: "#/components/parameters/CommandCustomId"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The event type is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          description: The required `originGuid` query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
              example:
                Message: The requested resource does not support http method 'DELETE'.

  /CalendarOperatorAddCommands:
    post:
      operationId: addCalendarOperator
      tags: [Calendar]
      summary: Assign operator to shift
      description: |
        Assigns the user as an operator of the shift given by the event identifier.

        Required access right: _DataAdmin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarOperatorCommand"
            example:
              MeasurementId: 3
              Id: "1783836000"
              OriginGuid: 29488260-a3c8-4ed4-be08-2fd84fbfd66c
              UserId: 101
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /CalendarOperatorRemoveCommands:
    post:
      operationId: removeCalendarOperator
      tags: [Calendar]
      summary: Remove operator from shift
      description: |
        Removes the user from the operators of the shift given by the event identifier.

        Required access right: _DataAdmin_.
      parameters:
        - $ref: "#/components/parameters/CommandCustomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarOperatorCommand"
            example:
              MeasurementId: 3
              Id: "1783836000"
              OriginGuid: 29488260-a3c8-4ed4-be08-2fd84fbfd66c
              UserId: 101
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  # ---------------------------------------------------------------------------
  # Users & Subscriptions
  # ---------------------------------------------------------------------------
  /Users:
    get:
      operationId: getUsers
      tags: [Users & Subscriptions]
      summary: Get users
      description: |
        Gets the users of the current subscription (identifier and display name only). Use it to resolve the user references returned by other endpoints.
      responses:
        "200":
          description: The users of the current subscription.
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  _links:
                    $ref: "#/components/schemas/HalLinks"
                  _embedded:
                    type: object
                    properties:
                      user:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserSummary"
              example:
                _links:
                  self:
                    href: /Api/Users
                _embedded:
                  user:
                    - userId: 101
                      name: Jan Novák
                      _links:
                        self:
                          href: /Api/Users/101
        "401":
          $ref: "#/components/responses/Unauthorized"

  /Users/{id}:
    get:
      operationId: getUser
      tags: [Users & Subscriptions]
      summary: Get user
      description: Gets the user of the current subscription (identifier and display name only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The user.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/UserSummary"
              example:
                userId: 101
                name: Jan Novák
                _links:
                  self:
                    href: /Api/Users/101
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /Users/Me:
    get:
      operationId: getMe
      tags: [Users & Subscriptions]
      summary: Get current user
      description: Gets the full profile of the user the access token or API key belongs to. Useful for an integration to discover its own `userId`.
      responses:
        "200":
          description: The profile of the token owner.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              example:
                userId: 101
                name: Jan Novák
                email: jan.novak@example.com
                language: cs-CZ
                _links:
                  self:
                    href: /Api/Users/101
        "401":
          $ref: "#/components/responses/Unauthorized"

  /Subscriptions/Current:
    get:
      operationId: getCurrentSubscription
      tags: [Users & Subscriptions]
      summary: Get current subscription
      description: |
        Gets the current subscription of the user - the customer account whose data the collection endpoints (measurements, the job plan, users) return.
      responses:
        "200":
          description: The current subscription.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/Subscription"
              example:
                subscriptionId: 83
                title: Demo subscription
                name: Demo subscription
                isArchived: false
                _links:
                  self:
                    href: /Api/Subscriptions/83
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The user has no current subscription, or it is archived.

  /Subscriptions:
    get:
      operationId: getSubscriptions
      tags: [Users & Subscriptions]
      summary: Get subscriptions
      description: Gets all subscriptions the user belongs to.
      responses:
        "200":
          description: The subscriptions of the user.
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  currentSubscriptionId:
                    type: [integer, "null"]
                    description: The identifier of the current subscription; omitted when the user has none.
                  _links:
                    $ref: "#/components/schemas/HalLinks"
                  _embedded:
                    type: object
                    properties:
                      subscription:
                        type: array
                        items:
                          $ref: "#/components/schemas/Subscription"
              example:
                currentSubscriptionId: 83
                _links:
                  self:
                    href: /Api/Subscriptions
                _embedded:
                  subscription:
                    - subscriptionId: 83
                      title: Demo subscription
                      name: Demo subscription
                      isArchived: false
                      _links:
                        self:
                          href: /Api/Subscriptions/83
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Command Results
  # ---------------------------------------------------------------------------
  /commandResults/{id}:
    get:
      operationId: getCommandResult
      tags: [Command Results]
      summary: Get command result
      description: Gets the result of an asynchronous command. Poll this endpoint until the `result` reaches one of the final states (see the group description).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the command.
      responses:
        "200":
          description: The command result.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/CommandResult"
              example:
                guid: acace64f-35d1-4892-8daa-a63062092c8f
                result: DataError
                reason: Header does not contain any valid field.
                createdDate: "2026-07-11T15:03:57.4452994Z"
                processedDate: "2026-07-11T15:03:57.6753207Z"
                _links:
                  self:
                    href: /api/commandResults/acace64f-35d1-4892-8daa-a63062092c8f
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /commandResults:
    get:
      operationId: getCommandResultByCustomId
      tags: [Command Results]
      summary: Get command result by custom identifier
      description: Gets the result of an asynchronous command by the client-supplied `commandCustomId` that was passed with the command request.
      parameters:
        - name: commandCustomId
          in: query
          required: true
          schema:
            type: string
          description: The client-supplied command identifier.
      responses:
        "200":
          description: The command result.
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  # ---------------------------------------------------------------------------
  # SCIM Provisioning
  # ---------------------------------------------------------------------------
  /Directory/{directoryId}/Scim/v2/Users:
    parameters:
      - $ref: "#/components/parameters/ScimDirectoryId"
    get:
      operationId: scimQueryUsers
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Query users (SCIM)
      description: |
        Returns the users of the directory as a SCIM `ListResponse`. By default only the users managed by the directory are returned; with `filterManagedType=all` the unmanaged users of the customer account are included as well (with `ManagedType: Unmanaged`).
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
          example: userName eq "jan.novak@example.com"
          description: "A SCIM filter expression. Supported attributes: `userName`, `displayName`, `locale`, `name.givenName`, `name.familyName`, `active`; unsupported attributes are ignored."
        - name: filterManagedType
          in: query
          required: false
          schema:
            type: string
            enum: [all]
          description: When set to `all`, users not managed by this directory are included in the result.
      responses:
        "200":
          description: The SCIM list response with the matching users.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUserListResponse"
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
                totalResults: 1
                itemsPerPage: 1
                startIndex: 1
                Resources:
                  - schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
                    id: "101"
                    userName: jan.novak@example.com
                    displayName: Jan Novák
                    active: true
                    ManagedType: Managed
        "400":
          description: The filter expression is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
    post:
      operationId: scimCreateUser
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Create user (SCIM)
      description: |
        Creates a user in the directory. The `userName` becomes the e-mail (and login) of the Plantyst user; `locale` sets the user language (the directory default is used when omitted).

        The domain of the `userName` e-mail must be one of the domains registered for the directory (agreed during the directory setup) - other domains are rejected with `400 Bad Request`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
            example:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
              userName: jan.novak@example.com
              displayName: Jan Novák
              name:
                givenName: Jan
                familyName: Novák
              locale: cs-CZ
              active: true
      responses:
        "201":
          description: The created user, including its `id`.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: The payload is invalid, or the `userName` domain is not registered for the directory.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "409":
          description: A user with the given `userName` already exists.

  /Directory/{directoryId}/Scim/v2/Users/{id}:
    parameters:
      - $ref: "#/components/parameters/ScimDirectoryId"
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The SCIM user identifier (equals the Plantyst `userId`).
    get:
      operationId: scimGetUser
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Get user (SCIM)
      responses:
        "200":
          description: The SCIM user.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "404":
          description: The user does not exist in the directory.
    patch:
      operationId: scimPatchUser
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Update user (SCIM PatchOp)
      description: |
        Applies a SCIM `PatchOp` document to the user (`add`, `replace` and `remove` operations on the user attributes; deactivate a user by setting `active` to `false`).

        `PUT` replacement is not supported (`501 Not Implemented`) - use `PATCH`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
            example:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
              Operations:
                - op: replace
                  path: displayName
                  value: Jan Novák ml.
      responses:
        "200":
          description: The updated SCIM user.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: The patch document is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "404":
          description: The user does not exist in the directory.
    delete:
      operationId: scimDeleteUser
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Deactivate user (SCIM)
      description: Deactivates the user. The Plantyst account is kept for historical references (`creatorId`, comment authors, ...), but can no longer sign in and is no longer returned by the SCIM endpoints (`404`).
      responses:
        "204":
          description: The user was deactivated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "404":
          description: The user does not exist in the directory.

  /Directory/{directoryId}/Scim/v2/Groups:
    parameters:
      - $ref: "#/components/parameters/ScimDirectoryId"
    get:
      operationId: scimQueryGroups
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Query groups (SCIM)
      description: |
        Returns the groups under the directory root as a SCIM `ListResponse` - the same groups that form the measurement hierarchy elsewhere in the API.
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
          example: displayName eq "Hall A"
          description: "A SCIM filter expression. Supported attributes: `displayName`, `shortName`; unsupported attributes are ignored."
        - name: excludedAttributes
          in: query
          required: false
          schema:
            type: string
          example: members
          description: Comma-separated attribute names to omit from the result (e.g. `members`).
      responses:
        "200":
          description: The SCIM list response with the matching groups.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroupListResponse"
        "400":
          description: The filter expression is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
    post:
      operationId: scimCreateGroup
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Create group (SCIM)
      description: |
        Creates a group as a child of the directory root group, or of the group named by `parentGroupDisplayName` - extending the group hierarchy.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
            example:
              schemas: ["urn:ietf:params:scim:schemas:core:2.0:Group", "urn:ietf:params:scim:schemas:extension:plantyst:1.0:Group"]
              displayName: Line 1 (Hall A)
              shortName: Line 1
              parentGroupDisplayName: Hall A
              members:
                - value: "101"
      responses:
        "201":
          description: The created group, including its `id`.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "400":
          description: The payload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "404":
          description: The group named by `parentGroupDisplayName` does not exist in the directory.
        "409":
          description: A group with the given `displayName` already exists.

  /Directory/{directoryId}/Scim/v2/Groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ScimDirectoryId"
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The SCIM group identifier (equals the group identifier used elsewhere in the API, e.g. `groupId` of `/Measurements`).
    get:
      operationId: scimGetGroup
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Get group (SCIM)
      parameters:
        - name: excludedAttributes
          in: query
          required: false
          schema:
            type: string
          example: members
          description: Comma-separated attribute names to omit from the result.
      responses:
        "200":
          description: The SCIM group.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
              example:
                schemas: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
                id: "51"
                displayName: Hall A
                shortName: A
                members:
                  - value: "101"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "404":
          description: The group does not exist - or the lookup of an existing group failed on a missing group-directory link (a known server-side issue affecting individual group retrieval and updates; the query, create and delete endpoints are not affected). Use the query endpoint with a `displayName` filter as a workaround.
    patch:
      operationId: scimPatchGroup
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Update group (SCIM PatchOp)
      description: |
        Applies a SCIM `PatchOp` document to the group - typically `add` and `remove` operations on `members` (membership changes control the access of the users to the measurements under the group), a `replace` of `displayName`, or a `replace` of `parentGroupDisplayName` to move the group under a different parent in the hierarchy.

        `PUT` replacement is not supported (`501 Not Implemented`) - use `PATCH`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
            example:
              schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
              Operations:
                - op: add
                  path: members
                  value:
                    - value: "101"
      responses:
        "200":
          description: The updated SCIM group.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "400":
          description: The patch document is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "404":
          description: The group does not exist in the directory.
    delete:
      operationId: scimDeleteGroup
      security:
        - oauth2: []
      tags: [SCIM Provisioning]
      summary: Delete group (SCIM)
      description: Deletes the group. Only empty leaf groups can be deleted - a group with child groups or content, and the groups representing the subscription or the directory itself, are rejected.
      responses:
        "204":
          description: The group was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential is not bound to the directory given in the URL.
        "404":
          description: The group does not exist in the directory.
        "409":
          description: The group cannot be deleted - it has child groups (only leaf groups can be deleted), or it represents the subscription or the directory.

  # ---------------------------------------------------------------------------
  # Embedded Views
  # ---------------------------------------------------------------------------
  /AccessDevices:
    get:
      operationId: getAccessDevices
      tags: [Embedded Views]
      summary: Get access devices
      description: |
        Gets the access devices the authenticated user is currently assigned to. Use it to check which embedding slots the user occupies, for example to confirm that a switch has been applied.
      responses:
        "200":
          description: The access devices of the authenticated user.
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  _links:
                    $ref: "#/components/schemas/HalLinks"
                  _embedded:
                    type: object
                    properties:
                      accessDevice:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccessDevice"
              example:
                _links:
                  self:
                    href: /Api/AccessDevices
                _embedded:
                  accessDevice:
                    - accessDeviceId: 11
                      accessKey: a4fc8b47-e618-4098-a1cc-35508afe281c
                      _links:
                        self:
                          href: /Api/AccessDevices/11
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: assignAccessDevice
      tags: [Embedded Views]
      summary: Assign the current user to an access device
      description: |
        Assigns the authenticated user to the access device identified by the access key and removes the previous assignment. The operation is synchronous.

        The assignment is always made for the user of the credential the request is made with - there is no way to assign somebody else. A screen that is already open with this access key is not notified of the change and keeps running as the previously assigned user, so reload it after a successful call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [AccessKey]
              properties:
                AccessKey:
                  type: string
                  format: uuid
                  description: The access key of the access device to assign the user to.
            example:
              AccessKey: a4fc8b47-e618-4098-a1cc-35508afe281c
      responses:
        "204":
          description: The user was assigned to the access device.
        "400":
          description: No access device with the given access key exists - the response body carries the reason. A missing request body yields the same status code with an empty body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
              example:
                Message: Access device with given access key does not exist.
        "401":
          $ref: "#/components/responses/Unauthorized"

webhooks:
  metadocumentEvent:
    post:
      operationId: metadocumentEventWebhook
      tags: [Webhooks]
      summary: Metadocument changed
      description: |
        Plantyst calls the registered callback URL with a `POST` request whenever a metadocument is created, updated or deleted on a measurement accessible to the integration. Changes of comments and production entries are delivered as `MetadocumentUpdate` events carrying the whole document.

        The event is sent only after the change command finishes successfully (the `Success` command result).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              id: 0be9e2c6-6c53-4de1-8c39-0f2c81a4d7aa
              eventType: MetadocumentUpdate
              timestamp: 1783861200
              commandGuid: 21ef10c1-768b-48dc-b7a3-fd0e0a6e1102
              data:
                guid: 27a858a0-c244-4640-83f8-513dbc70c2e6
                measurementId: 3
                type: 3
                from: "2026-07-01T05:30:00Z"
                to: "2026-07-01T07:30:00Z"
                creatorId: 497
                color: "#969614"
                downtimeCodeKey: "144"
                downtimeCode:
                  code: "1.2"
                  title: Tool change
                eTag: "\"2f007274-0000-0d00-0000-6a4e18d80000\""
                lastModified: "2026-07-01T07:30:05Z"
                comments:
                  - id: 1
                    userId: 497
                    modificationTime: "2026-07-01T07:00:12Z"
                    text: Comment text
                customFields:
                  SourceId: ext-123
              configuration:
                Measurements: [3]
              authorization:
                authorizationType: Token
                value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
              appliedChanges: "[{\"op\":\"replace\",\"path\":\"/DowntimeCode\",\"value\":\"144\"}]"
      responses:
        "2XX":
          description: Return any `2xx` status code to acknowledge the delivery. Any other status code (or an unreachable URL) causes the delivery to be retried several times before it is dropped.

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 authorization code flow. Registration of the application (client_id, client_secret, redirect_uri) at support@plantyst.com.
      flows:
        authorizationCode:
          authorizationUrl: https://portal.plantyst.com/OAuth/Authorize
          tokenUrl: https://portal.plantyst.com/api/OAuth/Token
          refreshUrl: https://portal.plantyst.com/api/OAuth/Token
          scopes: {}
    basicApiKey:
      type: http
      scheme: basic
      description: "HTTP Basic authentication with the API key: username is the user's email, password is the API key."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-KEY
      description: The API key passed in a custom header.
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: The API key passed in the query string. Useful for quick tests, but avoid it in production integrations because URLs tend to end up in logs.

  parameters:
    ScimDirectoryId:
      name: directoryId
      in: path
      required: true
      schema:
        type: integer
      description: The identifier of the directory, assigned by Plantyst during the provisioning setup.

    CommandCustomId:
      name: commandCustomId
      in: query
      required: false
      schema:
        type: string
      description: |
        Optional client-supplied identifier of the command. The command result can later be looked up by this identifier - metadocument commands with `GET /MetadocumentCommandResults?commandCustomId={id}`, other commands with `GET /commandResults?commandCustomId={id}`.

        The value is accepted only once per user: a command sent with an identifier the same user has already used is answered with `409 Conflict` and is not executed. That is what makes a retry safe - after a `409`, the lookup above returns how the first attempt ended. Generate the value per operation (e.g. a GUID), reuse it only when retrying that same operation, and never derive it from business data; the identifiers never expire. See _Idempotency with `commandCustomId`_ in the introduction.

        It identifies the __command__, not the created record - it is a different thing from the `CustomId` property of a metadocument body despite the similar name.

  schemas:
    AuthorizationCodeTokenRequest:
      type: object
      title: Authorization code
      required: [grant_type, code, redirect_uri, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
          description: Temporary authorization code from the first step.
        redirect_uri:
          type: string
          description: redirect_uri of the application.
        client_id:
          type: string
          description: client_id of the application.
        client_secret:
          type: string
          description: client_secret of the application.

    RefreshTokenRequest:
      type: object
      title: Refresh token
      required: [grant_type, refresh_token, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
          description: The refresh token returned with the previous access token.
        client_id:
          type: string
          description: client_id of the application.
        client_secret:
          type: string
          description: client_secret of the application.

    AuthorizationToken:
      type: object
      properties:
        token_type:
          type: string
          description: The type of the token; always "Bearer".
        access_token:
          type: string
          description: The JWT token used to authorize API requests.
        expires_in:
          type: integer
          description: The number of seconds until the access token expires.
        refresh_token:
          type: string
          description: The token used to obtain a new access token when the current one expires.

    OAuthError:
      type: object
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unsupported_grant_type]

    ApiMessage:
      type: object
      properties:
        Message:
          type: string

    CommandLocation:
      type: object
      required: [location]
      properties:
        location:
          type: string
          description: The relative URL of the command-result resource. Always present in a successful `202` response.

    HalLink:
      type: object
      properties:
        href:
          type: string

    HalLinks:
      type: object
      description: HAL links of the resource. A relation with a single link is serialized as an object, a relation with multiple links as an array of link objects.
      additionalProperties: true

    MeasurementList:
      type: object
      properties:
        _links:
          type: object
          properties:
            self:
              $ref: "#/components/schemas/HalLink"
        _embedded:
          type: object
          properties:
            timezone:
              type: array
              description: Timezones referenced by the measurements.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The time zone identifier.
                  name:
                    type: string
                    description: The time zone full name.
                  iana:
                    type: string
                    description: The time zone IANA code.
                  _links:
                    $ref: "#/components/schemas/HalLinks"
            tag:
              type: array
              description: Tags created and assigned to the measurements.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The tag identifier.
                  title:
                    type: string
                    description: The tag title.
                  color:
                    type: string
                    description: The tag color represented as a hexadecimal color value.
                  _links:
                    $ref: "#/components/schemas/HalLinks"
            measurementDataVersion:
              type: array
              description: Versions of various measurement-related data.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The data version identifier.
                  title:
                    type: string
                    description: The data type title.
                  lastModified:
                    type: string
                    format: date-time
                    description: The date and time of the last data modification.
                  _links:
                    $ref: "#/components/schemas/HalLinks"
            measurementCustomField:
              type: array
              description: Custom fields assigned to the measurements.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: The custom field identifier.
                  key:
                    type: string
                    description: The custom field key.
                  value:
                    type: string
                    description: The custom field value.
                  _links:
                    $ref: "#/components/schemas/HalLinks"
            hierarchicalLocation:
              type: array
              description: Hierarchical locations of the measurements.
              items:
                type: object
                properties:
                  hierarchicalLocationId:
                    type: integer
                    description: The hierarchical location identifier.
                  title:
                    type: string
                    description: The location title.
                  shortTitle:
                    type: string
                    description: The location short title.
                  level:
                    type: string
                    description: |
                      The position of the location within the hierarchy tree, encoded as an opaque __materialized path__: a `/`-delimited string, wrapped in a leading and trailing slash, that is unique per location and gains one segment with each level of nesting (`/51/` for a top-level location, `/51/77/` for a location one level below it). Rebuild the tree by comparing these strings - see the endpoint description for the rules.
                    example: /51/77/
                  _links:
                    $ref: "#/components/schemas/HalLinks"
            measurement:
              type: array
              description: The array of Measurement objects.
              items:
                $ref: "#/components/schemas/Measurement"

    Measurement:
      type: object
      properties:
        measurementId:
          type: integer
        title:
          type: string
          description: "The displayed title, composed as `{prefixLabel} {baseTitle}` (just the base title when no prefix is set). When several measurements of the customer account end up with the same composed title, a ` (n)` suffix is appended to distinguish them (numbered in the order of `measurementId`)."
        baseTitle:
          type: string
          description: The base title of the measurement - the value managed by the measurement lifecycle commands of the Measurements group.
        prefixLabel:
          type: [string, "null"]
          description: An optional prefix (typically a machine number) displayed before the base title; managed by the measurement lifecycle commands.
        commandGuid:
          type: string
          format: uuid
          description: The identifier of the command that created or last changed the measurement; expected as `OriginGuid` by the measurement update and archive commands - re-read the measurement before a change.
        description:
          type: string
        quantityType:
          type: string
          enum: [speed, rate, stroke, time, temperature, humidity, power, flow, workload, rotation]
        archived:
          type: boolean
        first:
          type: string
          format: date-time
        rights:
          type: array
          items:
            type: string
            enum: [View, Contributor, DataAdmin, Admin, Owner]
        _links:
          $ref: "#/components/schemas/HalLinks"

    AccessDevice:
      type: object
      description: An access device - one slot for embedding a Portal screen into a customer application.
      properties:
        accessDeviceId:
          type: integer
        accessKey:
          type: string
          format: uuid
          description: The key the embedded screen carries in its URL. Treat it as a credential.
        _links:
          $ref: "#/components/schemas/HalLinks"

    UserSummary:
      type: object
      description: A user referenced from other resources (comment or production entry author, metadocument creator).
      properties:
        userId:
          type: integer
        name:
          type: string
        _links:
          $ref: "#/components/schemas/HalLinks"

    MetadocumentComment:
      type: object
      description: A comment of a metadocument.
      properties:
        id:
          type: integer
          description: The identifier of the comment and its version, unique within the metadocument. Updating a comment assigns it a new `id` - always re-read the metadocument to get the current `id` before a subsequent update or delete. Identifiers start at `0` and follow the order in which the comments were added or updated, not their time order.
        text:
          type: string
          maxLength: 500
          description: The comment text; rendered as Markdown by the Portal and may contain user or team mentions (see the group description).
        modificationTime:
          type: string
          format: date-time
          description: UTC date and time of the last modification.
        _links:
          $ref: "#/components/schemas/HalLinks"

    ProductionEntry:
      type: object
      description: A record of a produced amount within a metadocument (typically a job).
      properties:
        id:
          type: integer
          description: The identifier of the production entry and its version, unique within the metadocument. Updating a production entry assigns it a new `id` - always re-read the metadocument to get the current `id` before a subsequent update or delete. Identifiers start at `0` and follow the order in which the entries were added or updated, not the order of their `time`.
        time:
          type: string
          format: date-time
        value:
          type: number
          description: The produced amount.
        type:
          type: string
          maxLength: 100
          description: User-defined type of the entry (e.g. `OK`, `NOK`). Types beginning with `OK`, `NOK` or `Correction` enter the OEE metric set (`ok`, `nok` and `Production` of `/MeasurementMetricsQuery2`, see there).
        note:
          type: string
          maxLength: 500
        reason:
          type: string
          description: The reason of the entry (e.g. why the amount was corrected).
        _links:
          $ref: "#/components/schemas/HalLinks"

    ProductionEntryCreate:
      type: object
      required: [Value]
      properties:
        Value:
          type: number
          description: The produced amount.
        Type:
          type: string
          maxLength: 100
          description: User-defined type of the entry (e.g. `OK`, `NOK`). Types beginning with `OK`, `NOK` or `Correction` enter the OEE metric set (`ok`, `nok` and `Production` of `/MeasurementMetricsQuery2`, see there).
        Note:
          type: string
          maxLength: 500
        Time:
          type: string
          format: date-time
          description: >-
            The time of the entry. It must lie within the time range of the metadocument, both ends inclusive - a `Time` equal to `from` or `to` is accepted, one second outside is not. A `Time` outside the range is not rejected synchronously - the request is still answered with `202 Accepted` and the command finishes with the `DataError` result. When omitted, the current UTC time is used, which a running metadocument (without `to`) accepts, while for a metadocument in the past it ends with `DataError` - so always provide `Time` explicitly for those.
        Reason:
          type: string
          description: The reason of the entry (e.g. why the amount was corrected).

    MetadocumentLink:
      type: object
      description: A binding of a metadocument to records kept outside it (see `links` of the metadocument).
      properties:
        id:
          type: string
          description: The identifier of the bound records.
        type:
          type: integer
          enum: [1, 2, 3]
          description: >-
            The kind of the binding. `1` - the metadocument is one instance of a job planned with a `multipleInstanceId`; `id` equals that `multipleInstanceId` and groups the instances of the same job (see the `JobType` schema). `2` - the production records of the job were imported as a batch by `/ProductionEntriesImportCommands`; `id` identifies the batch. `3` - a changeover detected by Plantyst between two jobs; the same item appears on the previous job, the next job and the downtime between them, and its `id` joins the identifiers of those three metadocuments with commas.
        Prefetch:
          type: string
          description: >-
            A summary of the bound records as a JSON string; present only for `type: 2`, where it carries `FirstEntryTime` and `LastEntryTime`, the time range the imported records span. Note the capital letter of the property name.

    Tool:
      type: object
      description: A tool used by the job.
      properties:
        customId:
          type: string
          description: User-defined identifier of the tool.

    PropertyLock:
      type: object
      description: A lock of a metadocument property. Locked properties can be modified only by the user who locked them or by a user with the Admin right.
      properties:
        propertyName:
          type: string
        userId:
          type: [integer, "null"]
          description: The user who locked the property.

    Metadocument:
      type: object
      description: |
        A metadocument returned by the API. Properties with `null` values are omitted in HAL responses.

        The related records are embedded under `_embedded`: `comment` (the comments), `productionEntry` (the production entries) and `user` (the users referenced by the metadocument and its records). An empty collection is omitted - the key is absent rather than an empty array. In the list responses (`/MetadocumentsQuery`, `/Metadocuments?customId=`, `/TaskEntries`) the users are returned once at the list level and the embedded metadocuments carry only `comment` and `productionEntry`. Production records imported as a batch (`/ProductionEntriesImportCommands`) are not part of `productionEntry` - such a job carries a `links` item with `type: 2` instead (see `links`).
      properties:
        guid:
          type: string
          format: uuid
        type:
          type: integer
          enum: [0, 1, 2, 3]
          description: "The metadocument type: 0 = general, 1 = annotation, 2 = job, 3 = downtime."
        title:
          type: string
        description:
          type: string
          description: Extended description; supports the Markdown markup language.
        customId:
          type: string
          description: User-defined identifier.
        creatorId:
          type: integer
          description: The identifier of the user who created the metadocument.
        measurementId:
          type: integer
        from:
          type: string
          format: date-time
        to:
          type: [string, "null"]
          format: date-time
          description: "`null` denotes an unlimited (still running) metadocument."
        lastModified:
          type: string
          format: date-time
        eTag:
          type: string
          description: The concurrency stamp of the metadocument; pass it to update/delete operations for the optimistic concurrency check.
        color:
          type: string
          description: Color in the hex color code.
        setpoint:
          type: number
          description: The desired value of the measured quantity during the metadocument.
        setpointQuantityType:
          type: string
          description: The quantity type of the setpoint.
        operations:
          type: array
          items:
            type: string
          description: Operations of the job, as an array of string values.
        downtimeCode:
          type: string
          description: Currently returns the same value as `downtimeCodeKey`. Use `downtimeCodeKey` instead; to obtain the human-readable code and its description, look the key up in the downtime code dictionary.
        downtimeCodeKey:
          type: string
          description: The key of the assigned downtime code (see the downtime code dictionary).
        workOrderNumber:
          type: string
        plannedFrom:
          type: string
          format: date-time
        plannedTo:
          type: string
          format: date-time
        plannedDuration:
          type: number
          description: The planned duration, in seconds.
        targetAmount:
          type: number
          description: The target production amount of the job.
        maximumProductionCoefficient:
          type: number
          description: The numerator of the highest production coefficient the job may reach (see the group description).
        currentProductionCoefficient:
          type: number
          description: The numerator of the production coefficient in effect.
        maximumProductionCoefficientDenominator:
          type: number
          description: The denominator of the maximum production coefficient; when absent, the coefficient is the numerator itself.
        currentProductionCoefficientDenominator:
          type: number
          description: The denominator of the current production coefficient; when absent, the coefficient is the numerator itself.
        customFields:
          type: object
          additionalProperties: true
          description: User-defined key/value fields.
        readOnly:
          type: boolean
          description: When `true`, the metadocument cannot be modified.
        locks:
          type: array
          items:
            $ref: "#/components/schemas/PropertyLock"
        automaticTermination:
          type: boolean
          description: Determines whether the metadocument will be terminated automatically.
        task:
          type: object
          description: The task attached to the metadocument (see Tasks (Beta)); present only when the metadocument has a task.
          properties:
            id:
              type: string
              description: The task identifier (`/TaskEntries/{id}`).
            initialTitle:
              type: string
              description: The title the task was created with.
        tools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
        links:
          type: array
          description: >-
            Bindings of the metadocument to records kept outside it; present only when the metadocument has one (the kinds are listed at `MetadocumentLink`). The item with `type: 2` marks a job whose production records were imported as a batch by `/ProductionEntriesImportCommands` - those records are not returned in `_embedded.productionEntry`, so a job with this item is not a job without production records. Not to be confused with the HAL `_links`.
          items:
            $ref: "#/components/schemas/MetadocumentLink"
        _links:
          $ref: "#/components/schemas/HalLinks"
        _embedded:
          type: object
          properties:
            comment:
              type: array
              items:
                $ref: "#/components/schemas/MetadocumentComment"
            productionEntry:
              type: array
              items:
                $ref: "#/components/schemas/ProductionEntry"
            user:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"

    MetadocumentCreate:
      type: object
      required: [MeasurementId, Type, From]
      properties:
        MeasurementId:
          type: integer
        Type:
          type: integer
          enum: [0, 1, 2, 3]
          description: "The metadocument type: 0 = general, 1 = annotation, 2 = job, 3 = downtime."
        From:
          type: string
          format: date-time
        To:
          type: [string, "null"]
          format: date-time
          description: Omit or set to `null` for an unlimited (still running) metadocument.
        Title:
          type: string
          description: The title of the metadocument (typically for jobs). For downtimes classified by a downtime code, leave the title empty and set only `DowntimeCodeKey` - the UI then displays the dictionary description of the code, and a later change of the description in the dictionary propagates to all downtimes.
        Description:
          type: string
          description: Extended description; supports the Markdown markup language.
        CustomId:
          type: string
          description: |
            User-defined identifier of the metadocument. By default, at most one metadocument with the given `CustomId` per measurement is allowed (see the `allowMultiple` parameter) - a create with an already used value is rejected synchronously with `409 Conflict` carrying the URL of the existing metadocument, which makes the create safe to retry.

            The uniqueness is tied to the __existence of the metadocument__, not to the value: deleting the metadocument frees its `CustomId`, and the same value can be used again. An identifier derived from the content of the record is therefore safe - a user who deletes a downtime and records the identical one again gets through.

            Not to be confused with the `commandCustomId` query parameter, which identifies one write operation, is never freed and therefore must not be derived from the content of the record (see the group description).
        Text:
          type: string
          maxLength: 500
          description: When provided, the first comment of the metadocument is created with this text.
        CommentTime:
          type: string
          format: date-time
          description: The time of the first comment (used together with `Text`); when omitted, the current UTC time is used.
        Setpoint:
          type: number
          description: The desired value of the measured quantity during the metadocument.
        SetpointQuantityType:
          type: string
          description: The quantity type of the setpoint.
        Color:
          type: string
          description: Color in the hex color code.
        Operations:
          type: array
          items:
            type: string
          description: Operations of the job, as an array of string values.
        DowntimeCodeKey:
          type: string
          description: The key of the downtime code to assign (see the downtime code dictionary). For downtimes, set only this property and leave `Title` empty.
        WorkOrderNumber:
          type: string
        PlannedFrom:
          type: string
          format: date-time
        PlannedTo:
          type: string
          format: date-time
        PlannedDuration:
          type: number
          description: The planned duration, in seconds.
        TargetAmount:
          type: number
          description: The target production amount of the job.
        MaximumProductionCoefficient:
          type: number
          description: The numerator of the highest production coefficient the job may reach. The four coefficient properties are validated together - see _Production coefficient_ in the group description.
        CurrentProductionCoefficient:
          type: number
          description: The numerator of the production coefficient in effect. Must be filled whenever `MaximumProductionCoefficient` is.
        MaximumProductionCoefficientDenominator:
          type: number
          description: The denominator of the maximum production coefficient; when omitted, the coefficient is the numerator itself.
        CurrentProductionCoefficientDenominator:
          type: number
          description: The denominator of the current production coefficient; when omitted, the coefficient is the numerator itself.
        CustomFields:
          type: object
          additionalProperties: true
          description: User-defined key/value fields.
        AutomaticTermination:
          type: boolean
          description: Determines whether the metadocument will be terminated automatically.
        Tools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"

    MetadocumentUpdate:
      type: object
      description: Only the properties present in the payload are changed.
      properties:
        ETag:
          type: string
          description: The concurrency stamp for the optimistic concurrency check; when the metadocument has been modified in the meantime, the command finishes with the `Conflict` result.
        Title:
          type: [string, "null"]
          description: Can be set to `null` only while another property carries the content of the metadocument - see _Clearing a property with `null`_ in the group description.
        From:
          type: string
          format: date-time
          description: Cannot be set to `null`; a metadocument always has a start.
        To:
          type: [string, "null"]
          format: date-time
          description: Set to `null` for an unlimited (still running) metadocument.
        Description:
          type: [string, "null"]
          description: Extended description; supports the Markdown markup language.
        CustomId:
          type: [string, "null"]
        Color:
          type: [string, "null"]
          description: Color in the hex color code. The value is normalized, so it is read back in upper case.
        Setpoint:
          type: [number, "null"]
        Operations:
          type: [array, "null"]
          items:
            type: string
          description: Set to `null` to clear; the property is then read back as an empty array.
        DowntimeCodeKey:
          type: [string, "null"]
          description: The key of the downtime code to assign (see the downtime code dictionary). For downtimes, set only this property and leave `Title` empty.
        WorkOrderNumber:
          type: [string, "null"]
        PlannedFrom:
          type: [string, "null"]
          format: date-time
        PlannedTo:
          type: [string, "null"]
          format: date-time
        PlannedDuration:
          type: [number, "null"]
          description: The planned duration, in seconds.
        TargetAmount:
          type: [number, "null"]
        MaximumProductionCoefficient:
          type: [number, "null"]
          description: The numerator of the highest production coefficient the job may reach. The four coefficient properties are validated together against the resulting state of the metadocument; send all four as `null` to remove the coefficient - see _Production coefficient_ in the group description.
        CurrentProductionCoefficient:
          type: [number, "null"]
          description: The numerator of the production coefficient in effect. Must end up filled whenever `MaximumProductionCoefficient` is, and must not exceed the maximum coefficient when both are compared as fractions.
        MaximumProductionCoefficientDenominator:
          type: [number, "null"]
          description: The denominator of the maximum production coefficient; when `null`, the coefficient is the numerator itself.
        CurrentProductionCoefficientDenominator:
          type: [number, "null"]
          description: The denominator of the current production coefficient; when `null`, the coefficient is the numerator itself.
        CustomFields:
          type: [object, "null"]
          additionalProperties: true
        AutomaticTermination:
          type: [boolean, "null"]
        Tools:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Tool"
          description: Set to `null` to clear; the property is then read back as an empty array.

    MetadocumentCommandResult:
      type: object
      description: >-
        The result of a metadocument command. Unlike the generic command result (`/commandResults/{id}`) it carries no `reason` - a `DataError` or `Failed` result names no cause - and no identifier of a created comment or production entry.
      properties:
        guid:
          type: string
          format: uuid
          description: Unique identifier of the metadocument command.
        result:
          type: string
          enum: [Waiting, InProgress, Success, Conflict, DataError, Failed, AlreadyApplied]
          description: The state of the command (see the Metadocuments group description).
        createdDate:
          type: [string, "null"]
          format: date-time
          description: UTC date and time when the command was created.
        processedDate:
          type: string
          format: date-time
          description: UTC date and time when the command was processed.
        metadocumentGuid:
          type: string
          format: uuid
          description: The identifier of the related metadocument.
        _links:
          $ref: "#/components/schemas/HalLinks"

    JobType:
      type: object
      description: A planned job (a "job type" in the API contract) - one job of the job plan imported through the CSV import. Properties with `null` values are omitted in HAL responses.
      properties:
        jobTypeId:
          type: integer
          description: The identifier of the planned job. It is NOT stable across imports - every CSV import replaces the job plan and assigns new identifiers. To correlate the planned jobs with an external system, use `WorkOrderNumber` or a `Custom.`-prefixed field instead.
        title:
          type: string
        setpoint:
          type: [number, "null"]
          description: The desired production speed during the job.
        measurementId:
          type: integer
        plannedFrom:
          type: [string, "null"]
          format: date-time
        plannedTo:
          type: [string, "null"]
          format: date-time
        isPermanent:
          type: boolean
          description: Permanent planned jobs stay available in the job plan.
        currentState:
          type: string
          enum: [Available, Running, Paused, Finished]
        maximumProductionCoefficient:
          type: [number, "null"]
          description: The numerator of the highest production coefficient the job may reach (see _Production coefficient_ in the Metadocuments group).
        maximumProductionCoefficientDenominator:
          type: [number, "null"]
          description: The denominator of the maximum production coefficient; when absent, the coefficient is the numerator itself.
        order:
          type: [integer, "null"]
          description: The position of the planned job in the job plan (the order of rows in the imported file).
        commandGuid:
          type: string
          format: uuid
          description: The identifier of the import command that created the planned job.
        description:
          type: [string, "null"]
        operations:
          type: [array, "null"]
          items:
            type: string
        availableTools:
          type: [array, "null"]
          items:
            type: string
        targetAmount:
          type: [number, "null"]
          description: The target production amount of the job.
        customFields:
          type: [object, "null"]
          additionalProperties: true
          description: User-defined key/value fields imported from the `Custom.`-prefixed CSV columns.
        workOrderNumber:
          type: [string, "null"]
        completedDate:
          type: [string, "null"]
          format: date-time
          description: The date when the job has been completed.
        multipleInstanceId:
          type: [string, "null"]
          description: The identifier grouping multiple instances of the same job.
        isMultipleInstanceOverlapDisabled:
          type: [boolean, "null"]
          description: Determines whether the instances of the job cannot run concurrently.
        _links:
          $ref: "#/components/schemas/HalLinks"

    CommandResult:
      type: object
      properties:
        guid:
          type: string
          format: uuid
          description: Unique identifier of the command.
        result:
          type: string
          enum: [Waiting, InProgress, Success, Conflict, DataError, Failed, AlreadyApplied]
          description: The state of the command (see the Command Results group description).
        reason:
          type: [string, "null"]
          description: The description of the problem when the command failed (e.g. with the `DataError` result). A free-form diagnostic message for logging and human diagnosis - its wording is not part of the contract, so do not parse it and do not display it to end users; branch on `result` instead.
        createdDate:
          type: [string, "null"]
          format: date-time
          description: UTC date and time when the command was created.
        processedDate:
          type: string
          format: date-time
          description: UTC date and time when the command was processed.
        _links:
          $ref: "#/components/schemas/HalLinks"


    DowntimeCode:
      type: object
      description: A downtime code from the dictionary. Properties with `null` values are omitted in HAL responses.
      properties:
        downtimeCodeId:
          type: integer
        key:
          type: string
          description: Server-assigned identifier of the code, referenced by downtime metadocuments (`downtimeCodeKey`).
        code:
          type: string
          maxLength: 10
          description: Short human-readable code displayed in the UI.
        title:
          type: string
          description: The description of the downtime cause.
        color:
          type: [string, "null"]
          description: Color in the hex color code.
        validTo:
          type: [string, "null"]
          format: date-time
          description: Soft-delete timestamp; `null` for active codes.
        commandGuid:
          type: string
          format: uuid
          description: The identifier of the command that created or last changed the code; used as `OriginGuids` in the management commands.
        canBeSelected:
          type: boolean
        maxLength:
          type: [integer, "null"]
          description: The maximal length of the downtime in seconds; a longer downtime is automatically split.
        isBreakdown:
          type: [boolean, "null"]
        isCommentRequired:
          type: [boolean, "null"]
        isTransferable:
          type: [boolean, "null"]
        isShiftPauseTransferable:
          type: [boolean, "null"]
        isReducingPlannedTime:
          type: [boolean, "null"]
        isReducingProduction:
          type: [boolean, "null"]
        isReducingProductionTime:
          type: [boolean, "null"]
        _links:
          $ref: "#/components/schemas/HalLinks"

    DowntimeCodeWrite:
      type: object
      required: [Code, Title]
      properties:
        Code:
          type: string
          maxLength: 10
          pattern: '^([a-zA-Z0-9]+\.?)+$'
          description: Short human-readable code displayed in the UI.
        Title:
          type: string
          description: The description of the downtime cause.
        Color:
          type: string
          description: Color in the hex color code.
        CanBeSelected:
          type: boolean
        IsBreakdown:
          type: boolean
        IsCommentRequired:
          type: boolean
        IsTransferable:
          type: boolean
        IsShiftPauseTransferable:
          type: boolean
        IsReducingPlannedTime:
          type: boolean
        IsReducingProduction:
          type: boolean
        IsReducingProductionTime:
          type: boolean
        MaxLength:
          type: integer
          description: The maximal length of the downtime in seconds; a longer downtime is automatically split.


    PauseInterval:
      type: object
      description: A pause within a shift, expressed as offsets from the shift start in the `[dd.]hh:mm:ss` format.
      properties:
        from:
          type: string
          description: The offset of the pause start from the shift start.
        to:
          type: string
          description: The offset of the pause end from the shift start.

    PauseIntervalWrite:
      type: object
      description: A pause within a shift, expressed as offsets from the shift start in the `[dd.]hh:mm:ss` format.
      properties:
        From:
          type: string
          description: The offset of the pause start from the shift start.
        To:
          type: string
          description: The offset of the pause end from the shift start.

    CalendarEvent:
      type: object
      description: A calendar event - a shift (`PlannedProduction`) or a planned shutdown (`PlannedShutdown`). Properties with `null` values are omitted in HAL responses.
      properties:
        eventType:
          type: string
          enum: [PlannedProduction, PlannedShutdown]
        measurementId:
          type: integer
        start:
          type: string
          format: date-time
          description: The start of the event; its Unix timestamp is the event identifier.
        end:
          type: string
          format: date-time
        guid:
          type: string
          format: uuid
          description: The identifier of the command that created or last changed the event; used as `OriginGuid` in the management operations.
        title:
          type: [string, "null"]
        shiftName:
          type: [string, "null"]
        shiftType:
          type: [string, "null"]
          description: User-defined shift type label.
        pauses:
          type: array
          items:
            $ref: "#/components/schemas/PauseInterval"
        plannedOperatorAssignment:
          type: [number, "null"]
          description: The planned number of assigned operators.
        effectiveOperatorAssignment:
          type: [number, "null"]
          description: The effective number of assigned operators.
        overtime:
          type: boolean
        _links:
          $ref: "#/components/schemas/HalLinks"
          description: Besides `self`, the event carries an `operators` link relation pointing to the users assigned to the shift; their user objects are embedded at the list level (`_embedded.user`).

    CalendarEventList:
      type: object
      properties:
        hasDataAdminAccessRightDictionary:
          type: object
          additionalProperties:
            type: boolean
          description: For every queried measurement, whether the current user has the DataAdmin right (i.e. can manage its calendar).
        _links:
          $ref: "#/components/schemas/HalLinks"
        _embedded:
          type: object
          properties:
            event:
              type: array
              items:
                $ref: "#/components/schemas/CalendarEvent"
            user:
              type: array
              description: The operators assigned to the returned shifts (referenced from the events through their `operators` link relation).
              items:
                $ref: "#/components/schemas/UserSummary"

    CalendarOperatorCommand:
      type: object
      required: [MeasurementId, Id, OriginGuid, UserId]
      properties:
        MeasurementId:
          type: integer
        Id:
          type: string
          description: The event identifier (the Unix timestamp of the shift start).
        OriginGuid:
          type: string
          format: uuid
          description: The current `guid` of the event.
        UserId:
          type: integer
          description: The identifier of the operator (user).


    WebhookAuthorization:
      type: object
      description: A short-lived credential (valid for 1 hour) for calling the REST API as the integration user.
      properties:
        authorizationType:
          type: string
          enum: [Token, ApiKey]
          description: "The kind of the credential, not the name of an HTTP scheme. `Token` - send the value in the `Authorization: Bearer {value}` header; `ApiKey` - send it in the `X-API-KEY` header, never in `Authorization` (see Webhooks)."
        value:
          type: string

    WebhookComment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: [integer, "null"]
        modificationTime:
          type: string
          format: date-time
        text:
          type: string

    WebhookProductionEntry:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: [integer, "null"]
        time:
          type: string
          format: date-time
        value:
          type: number
        type:
          type: string
        note:
          type: [string, "null"]

    WebhookMetadocument:
      type: object
      description: The metadocument carried by the webhook. All metadocument properties (see the Metadocuments group) are present in camelCase; properties with `null` or empty values are omitted. Unlike the REST representation, the related records are inlined (no `_links`/`_embedded`).
      additionalProperties: true
      properties:
        deleted:
          type: boolean
          description: Present with the value `true` on `MetadocumentDelete` events.
        guid:
          type: string
          format: uuid
        measurementId:
          type: integer
        type:
          type: integer
          enum: [0, 1, 2, 3]
          description: "The metadocument type: 0 = general, 1 = annotation, 2 = job, 3 = downtime."
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        eTag:
          type: string
        lastModified:
          type: string
          format: date-time
        color:
          type: [string, "null"]
          description: Color in the hex color code.
        downtimeCodeKey:
          type: [string, "null"]
          description: The key of the assigned downtime code.
        downtimeCode:
          type: [object, "null"]
          description: The assigned downtime code resolved from the dictionary. Note that unlike the REST representation (where `downtimeCode` is a string with the key), the webhook carries an object with the human-readable code and its description.
          properties:
            code:
              type: string
            title:
              type: string
        comments:
          type: array
          items:
            $ref: "#/components/schemas/WebhookComment"
        productionEntries:
          type: array
          items:
            $ref: "#/components/schemas/WebhookProductionEntry"
        links:
          type: array
          description: >-
            The bindings of the metadocument to records kept outside it, the same items as `links` of the REST representation (see the `MetadocumentLink` schema for the kinds); present only when the metadocument has one. The webhook serializes the item in camelCase, so the summary property is `prefetch` here, not `Prefetch`.
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: integer
                enum: [1, 2, 3]
              prefetch:
                type: string
        customFields:
          type: object
          additionalProperties: true

    WebhookEvent:
      type: object
      description: The body of a webhook delivery. Properties with `null` values are omitted.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of this delivery.
        eventType:
          type: string
          enum: [MetadocumentCreate, MetadocumentUpdate, MetadocumentDelete]
        timestamp:
          type: integer
          description: Unix timestamp (in seconds) when the event was raised.
        commandGuid:
          type: string
          format: uuid
          description: The identifier of the command that caused the change; equals the command identifier from the `location` URL returned to the API caller.
        data:
          $ref: "#/components/schemas/WebhookMetadocument"
        configuration:
          description: The per-integration configuration agreed during the webhook setup, echoed with every delivery (any JSON value; omitted when not configured).
        authorization:
          $ref: "#/components/schemas/WebhookAuthorization"
        appliedChanges:
          type: string
          description: "A JSON Patch (RFC 6902) document (as a string) describing the changes applied by the command. The paths use PascalCase property names (e.g. `/To`, `/DowntimeCode`, `/Comments/0`), unlike the camelCase payload. Special shapes: a create event carries a single `replace` of the path `/` with the whole document, a delete event a `replace` of `/` with `null`."


    UserProfile:
      type: object
      description: The full profile of the token owner.
      properties:
        userId:
          type: integer
        name:
          type: string
        email:
          type: string
        language:
          type: [string, "null"]
          description: The preferred language of the user (e.g. `cs-CZ`).
        _links:
          $ref: "#/components/schemas/HalLinks"

    Subscription:
      type: object
      properties:
        subscriptionId:
          type: integer
        title:
          type: string
        name:
          type: string
        isArchived:
          type: boolean
        _links:
          $ref: "#/components/schemas/HalLinks"


    ScimMeta:
      type: object
      properties:
        created:
          type: [string, "null"]
          format: date-time
        lastModified:
          type: [string, "null"]
          format: date-time

    ScimUser:
      type: object
      description: A SCIM 2.0 user. The `Role` and `ManagedType` properties are Plantyst extensions (note their PascalCase names). Unlike the HAL endpoints, the SCIM responses include properties with `null` values.
      required: [userName]
      properties:
        schemas:
          type: array
          items:
            type: string
          description: "Always `[\"urn:ietf:params:scim:schemas:core:2.0:User\"]` - the extension URN is not listed even though the extension properties are present."
        id:
          type: string
          description: The SCIM identifier; equals the Plantyst `userId`. Assigned by the server.
        userName:
          type: string
          description: The e-mail (login) of the user.
        displayName:
          type: string
        name:
          type: object
          properties:
            givenName:
              type: string
            familyName:
              type: string
        locale:
          type: [string, "null"]
          description: "The language of the user; supported values: `en-US`, `cs-CZ`, `en-GB` (case-insensitive; other values are rejected). When omitted on create, the directory default is used."
        phoneNumbers:
          type: array
          items:
            type: object
            properties:
              primary:
                type: boolean
              type:
                type: string
              value:
                type: string
        active:
          type: boolean
          description: Setting `active` to `false` deactivates the user.
        Role:
          type: [string, "null"]
          description: Plantyst extension - the Plantyst role of the user. Read-only. Note the PascalCase name.
        ManagedType:
          type: string
          enum: [Managed, Unmanaged]
          description: Plantyst extension - whether the user is managed by this directory. Read-only. Note the PascalCase name.
        meta:
          $ref: "#/components/schemas/ScimMeta"

    ScimGroup:
      type: object
      description: A SCIM 2.0 group, mapping to a Plantyst group - the primary organizational structure. The group hierarchy (built with `parentGroupDisplayName`) can serve as the hierarchy for measurements (see the group description). The `shortName` and `parentGroupDisplayName` properties are Plantyst extensions (`urn:ietf:params:scim:schemas:extension:plantyst:1.0:Group`).
      required: [displayName]
      properties:
        schemas:
          type: array
          items:
            type: string
          description: "`urn:ietf:params:scim:schemas:core:2.0:Group` and the Plantyst extension `urn:ietf:params:scim:schemas:extension:plantyst:1.0:Group`."
        id:
          type: string
          description: The SCIM identifier; equals the group identifier used elsewhere in the API (`groupId`, `hierarchicalLocationId`). Assigned by the server.
        displayName:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                description: The SCIM user identifier of the member.
        shortName:
          type: [string, "null"]
          description: Plantyst extension - a short label of the group. The `displayName` must be unique and therefore tends to be long; `shortName` is used instead of it where space matters (e.g. in hierarchical path displays showing the whole chain of groups). When not set, the `displayName` is used.
        parentGroupDisplayName:
          type: [string, "null"]
          description: Plantyst extension - the display name of the parent group (it must exist in the directory); when omitted on create, the group is created under the directory root group. Change it with a PATCH operation to move the group under a different parent.
        meta:
          $ref: "#/components/schemas/ScimMeta"

    ScimUserListResponse:
      type: object
      description: "A SCIM `ListResponse` with user resources. Note the PascalCase `Resources` key (per RFC 7644) next to the camelCase counters."
      properties:
        schemas:
          type: array
          items:
            type: string
          description: Always `["urn:ietf:params:scim:api:messages:2.0:ListResponse"]`.
        totalResults:
          type: integer
        itemsPerPage:
          type: integer
        startIndex:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimUser"

    ScimGroupListResponse:
      type: object
      description: "A SCIM `ListResponse` with group resources. Note the PascalCase `Resources` key (per RFC 7644) next to the camelCase counters."
      properties:
        schemas:
          type: array
          items:
            type: string
          description: Always `["urn:ietf:params:scim:api:messages:2.0:ListResponse"]`.
        totalResults:
          type: integer
        itemsPerPage:
          type: integer
        startIndex:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimGroup"

    ScimPatchOp:
      type: object
      description: A SCIM 2.0 PatchOp message.
      required: [Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
          description: Always `["urn:ietf:params:scim:api:messages:2.0:PatchOp"]`.
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [add, replace, remove]
              path:
                type: string
              value:
                description: The value of the operation (any JSON value).


    MetricsQueryPayload:
      type: object
      required: [Queries]
      description: |
        The queries of the basic metrics. The count of queries in one request is not limited, but the queries are computed with a limited parallelism - split large batches.

        The queried range is half-open: `From` is inclusive, `To` is exclusive. Both timestamps must be __UTC ISO 8601 with the `Z` suffix__ (e.g. `2026-07-08T00:00:00Z`) - a value with a numeric offset (`+02:00`) or without any zone is rejected with `400`.
      properties:
        Queries:
          type: array
          items:
            type: object
            required: [MeasurementId, From, To]
            properties:
              MeasurementId:
                type: integer
              From:
                type: string
                format: date-time
                description: The inclusive lower bound of the queried range, in UTC ISO 8601 (`Z` suffix required). Must be earlier than `To`.
              To:
                type: string
                format: date-time
                description: The exclusive upper bound of the queried range, in UTC ISO 8601 (`Z` suffix required). Must be later than `From` - an empty range (`From` = `To`) is rejected.
              MaximumCount:
                type: integer
                description: The maximum count of metrics to return; the metrics over this count are cut off from the end of the list. Always send it - the default value `0` returns an empty `results` array.

    Metric:
      type: object
      properties:
        name:
          type: string
        value:
          type: [number, "null"]
          description: The value of the metric; `null` when it cannot be computed.

    MetricsQueryResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              query:
                type: object
                description: The copy of the original query.
                properties:
                  measurementId:
                    type: integer
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  maximumCount:
                    type: integer
              results:
                type: array
                items:
                  $ref: "#/components/schemas/Metric"

    OeeMetricsQueryPayload:
      type: object
      required: [Queries]
      description: |
        The queries of the OEE metric set (Beta). The count of queries in one request is not limited, but the queries are computed with a limited parallelism - split large batches.

        The queried range is half-open: `From` is inclusive, `To` is exclusive. Both timestamps must be __UTC ISO 8601 with the `Z` suffix__ (e.g. `2026-07-08T00:00:00Z`) - a value with a numeric offset (`+02:00`) or without any zone is rejected with `400`.

        The range length and its age are limited - see the operation.
      properties:
        Queries:
          type: array
          items:
            type: object
            required: [MeasurementId, From, To]
            properties:
              MeasurementId:
                type: integer
              From:
                type: string
                format: date-time
                description: The inclusive lower bound of the queried range, in UTC ISO 8601 (`Z` suffix required). Must be earlier than `To` and at most 6 days old.
              To:
                type: string
                format: date-time
                description: The exclusive upper bound of the queried range, in UTC ISO 8601 (`Z` suffix required). Must be later than `From` - an empty range (`From` = `To`) is rejected - and at most 24 hours after it.

    OeeMetric:
      type: object
      description: One metric of the OEE set (Beta - the set of the returned metrics and their names may still change).
      properties:
        name:
          type: string
        value:
          type: [number, "null"]
          description: The value of the metric; `null` when it cannot be computed.

    OeeMetricsQueryResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              query:
                type: object
                description: The copy of the original query.
                properties:
                  measurementId:
                    type: integer
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
              results:
                type: array
                items:
                  $ref: "#/components/schemas/OeeMetric"

    Tag:
      type: object
      properties:
        id:
          type: string
          description: The tag identifier (returned as a string).
        title:
          type: string
        color:
          type: string
          description: "The HTML color of the tag (e.g. `#3498DB`)."
        _links:
          $ref: "#/components/schemas/HalLinks"

    TaskEntryList:
      type: object
      description: The HAL list of tasks with the related users and metadocuments.
      properties:
        _links:
          $ref: "#/components/schemas/HalLinks"
        _embedded:
          type: object
          properties:
            taskEntry:
              type: array
              items:
                $ref: "#/components/schemas/TaskEntry"
            user:
              type: array
              description: The users referenced by the tasks and their metadocuments.
              items:
                $ref: "#/components/schemas/UserSummary"
            metadocument:
              type: array
              description: The metadocuments the tasks belong to, in the `Metadocument` representation (with their own `_embedded.comment` and `_embedded.productionEntry`). Their users are returned in the list-level `user`.
              items:
                $ref: "#/components/schemas/Metadocument"

    TaskEntry:
      type: object
      properties:
        id:
          type: string
          description: The task identifier.
        title:
          type: string
        metadocumentGuid:
          type: string
          format: uuid
          description: The metadocument the task is attached to.
        commandGuid:
          type: string
          format: uuid
          description: The identifier of the command that created or last changed the task; expected as `OriginGuid` by the update and delete commands.
        createdDate:
          type: string
          format: date-time
        completedDate:
          type: [string, "null"]
          format: date-time
          description: The completion time; `null` for an open task.
        dueDate:
          type: [string, "null"]
          format: date-time
          description: The planned date of the task.
        deadline:
          type: [string, "null"]
          format: date-time
          description: The latest date the task should be finished.
        _links:
          $ref: "#/components/schemas/HalLinks"
        _embedded:
          type: object
          description: Present on the single-task endpoint only - the users referenced by the task and the metadocument the task is attached to (a single object, in the `Metadocument` representation). In the list, users and metadocuments are embedded once at the list level.
          properties:
            user:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"
            metadocument:
              $ref: "#/components/schemas/Metadocument"

  responses:
    Unauthorized:
      description: |
        Authorization has been denied for this request.

        __A rejected authentication is currently answered with a `302` redirect to the login page__, not with `401` - the body carries this same message. The `401` documented here is the intended semantics. Disable automatic redirect following in the client and treat a `302` on an API URL as an authentication failure; a client branching only on `401` would miss it (see Authorization).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiMessage"
          example:
            Message: Authorization has been denied for this request.
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiMessage"
          example:
            Message: Forbidden.
    NotFound:
      description: Not Found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiMessage"
          example:
            Message: Not Found.
    CommandAccepted:
      description: The command was accepted. The body contains the relative URL of the command result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandLocation"
          example:
            location: api/commandResults/5ad8938c-21dc-4b51-9b2c-3a8bfb2b816d
    MetadocumentCommandAccepted:
      description: The relative URL with the result of the requested operation.
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/CommandLocation"
          example:
            location: Api/MetadocumentCommandResults/b2ec82f2-1438-47cd-a982-6b2e3b0476c7
