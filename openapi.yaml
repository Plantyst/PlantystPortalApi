                              self:
                                href: /Api/Metadocuments/8c1f4e2a-6d3b-4b9e-9a71-2f0c5d7e6b44/ProductionEntries/1/
                              user:
                                href: /Api/Users/497
        "400":
          description: The payload is missing or contains more than 100 queries.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
